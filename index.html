<style>
/* ==========================================================
   THAMNEEL · ثامنيل — الصفحة الرئيسية
   ========================================================== */
:root{
  --ink:      #12100d;
  --ink-2:    #191612;
  --ink-3:    #221d18;
  --cream:    #f5f0e7;
  --muted:    #a49a8c;
  --muted-2:  #7d7466;
  --gold:     #c9a35c;
  --gold-2:   #e4c68a;
  --line:     rgba(245,240,231,.10);
  --line-2:   rgba(245,240,231,.18);
  --shadow:   0 24px 60px -28px rgba(0,0,0,.85);
  --radius:   18px;
  --max:      1200px;
  --ease:     cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--ink);
  color:var(--cream);
  font-family:"Tajawal","Noto Kufi Arabic","Outfit",sans-serif;
  font-weight:300;
  font-size:17px;
  line-height:1.85;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{  /* توهج خلفي ثابت */
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(60vw 60vw at 78% -10%, rgba(201,163,92,.16), transparent 60%),
    radial-gradient(50vw 50vw at 8% 12%, rgba(201,163,92,.07), transparent 60%),
    linear-gradient(180deg,#14110e 0%, #12100d 40%, #0e0c0a 100%);
}
.grain{
  position:fixed; inset:-50%; pointer-events:none; z-index:1; opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
::selection{ background:rgba(201,163,92,.35); color:#fff; }

h1,h2,h3{ margin:0; font-weight:400; letter-spacing:-0.01em; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
img,svg{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; }

.wrap{ width:100%; max-width:var(--max); margin-inline:auto; padding-inline:clamp(20px,5vw,48px); }

/* ---------- خط صغير فوق العناوين ---------- */
.eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  font-family:"Outfit",sans-serif; font-size:11px; font-weight:500;
  letter-spacing:.34em; text-transform:uppercase; color:var(--gold);
}
.eyebrow::before{
  content:""; width:34px; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
}
.arabic-label{
  font-family:"Noto Kufi Arabic",sans-serif; font-size:12px; font-weight:500;
  letter-spacing:.22em; color:var(--muted);
}

/* ---------- شريط التنقل ---------- */
.nav{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(14px) saturate(140%);
  background:linear-gradient(180deg, rgba(18,16,13,.86), rgba(18,16,13,.42));
  border-bottom:1px solid var(--line);
}
.nav-in{
  display:flex; align-items:center; justify-content:space-between; gap:18px;
  height:74px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-mark{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
  border:1px solid rgba(201,163,92,.4);
  background:linear-gradient(140deg, rgba(201,163,92,.22), rgba(201,163,92,.04));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.brand-mark span{
  font-family:"DM Serif Display",serif; font-size:17px; letter-spacing:.02em;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.brand-text b{
  font-family:"Outfit",sans-serif; font-weight:500; font-size:15px;
  letter-spacing:.36em; color:var(--cream);
}
.brand-text small{
  font-family:"Tajawal",sans-serif; font-size:11px; letter-spacing:.16em; color:var(--muted-2);
}
.nav-links{ display:flex; align-items:center; gap:30px; }
.nav-links a{
  font-size:14.5px; color:var(--muted); position:relative; padding:6px 0;
  transition:color .25s var(--ease);
}
.nav-links a::after{
  content:""; position:absolute; inset-inline:0; bottom:0; height:1px;
  background:var(--gold); transform:scaleX(0); transform-origin:right;
  transition:transform .35s var(--ease);
}
.nav-links a:hover{ color:var(--cream); }
.nav-links a:hover::after{ transform:scaleX(1); }

/* ---------- الأزرار ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  padding:14px 30px; border-radius:999px; font-size:15px; font-weight:500;
  font-family:"Noto Kufi Arabic",sans-serif; letter-spacing:.01em;
  border:1px solid transparent; cursor:pointer; white-space:nowrap;
  transition:transform .28s var(--ease), background .28s var(--ease),
             border-color .28s var(--ease), box-shadow .28s var(--ease), color .28s var(--ease);
}
.btn svg{ width:17px; height:17px; }
.btn .arrow{ transform:scaleX(-1); }
.btn-primary{
  background:linear-gradient(135deg,var(--gold-2),var(--gold));
  color:#17130c; box-shadow:0 14px 34px -16px rgba(201,163,92,.75);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 44px -16px rgba(201,163,92,.9);
}
.btn-ghost{ border-color:var(--line-2); color:var(--cream); background:rgba(255,255,255,.02); }
.btn-ghost:hover{ border-color:rgba(201,163,92,.55); color:var(--gold-2); transform:translateY(-2px); }
.btn-nav{ padding:11px 22px; font-size:14px; }
.nav-cta{ display:inline-flex; }

/* ---------- الواجهة الرئيسية ---------- */
.hero{ position:relative; z-index:2; padding:clamp(56px,9vw,110px) 0 clamp(70px,9vw,120px); }
.hero::before{
  content:""; position:absolute; inset:0; z-index:-1;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%), rgba(201,163,92,.11), transparent 68%);
  pointer-events:none;
}
.hero-grid{ display:grid; grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr); gap:clamp(36px,6vw,80px); align-items:center; }
.hero h1{
  font-family:"DM Serif Display",serif;
  font-size:clamp(38px,6.6vw,86px);
  line-height:1.02; letter-spacing:.04em;
  direction:ltr; text-align:right;
  margin:18px 0 6px;
  background-image:
    linear-gradient(100deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 38%),
    linear-gradient(180deg,#fffaf0 6%, var(--gold-2) 48%, #a37c37 100%);
  background-size:260% 100%, 100% 100%;
  background-position:220% 0, 0 0;
  background-repeat:no-repeat;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:sweep 7s ease-in-out 3.4s infinite;
}
@keyframes sweep{
  0%{ background-position:220% 0, 0 0; }
  60%,100%{ background-position:-120% 0, 0 0; }
}
.hero .arabic-name{
  font-family:"Amiri",serif; font-size:clamp(30px,4.6vw,52px); line-height:1.35;
  color:var(--cream); letter-spacing:.02em; margin-bottom:14px;
}
.hero .arabic-name span{ color:var(--gold); }
.hero-actions{ display:flex; flex-wrap:wrap; gap:14px; margin-top:34px; }

/* بطاقة العرض */
.stage{
  position:relative; border-radius:26px; overflow:hidden;
  border:1px solid var(--line-2);
  background:linear-gradient(160deg, var(--ink-3), #0d0b09);
  box-shadow:var(--shadow);
  aspect-ratio:4/5;
}
.stage svg{ width:100%; height:100%; }
.stage-caption{
  position:absolute; inset-block-start:18px; inset-inline-start:18px; inset-inline-end:18px;
  display:flex; justify-content:flex-end; align-items:center;
  font-family:"Outfit",sans-serif; font-size:11px; letter-spacing:.24em; color:var(--muted);
  text-transform:uppercase;
}

/* ---------- الأقسام ---------- */
section{ position:relative; z-index:2; }
#contact{ padding-top:clamp(46px,6vw,78px); }
.sec{ padding:clamp(72px,10vw,132px) 0; }

/* ---------- تواصل ---------- */
.contact-box{
  position:relative; overflow:hidden;
  border:1px solid var(--line-2); border-radius:26px;
  background:linear-gradient(150deg, rgba(201,163,92,.10), rgba(245,240,231,.02) 42%, rgba(201,163,92,.07));
  padding:clamp(34px,5.5vw,76px);
  display:grid; grid-template-columns:1fr; gap:clamp(24px,3.5vw,40px); align-items:center;
  max-width:860px; margin-inline:auto; text-align:center;
}
.contact-box .eyebrow{ justify-content:center; }
.contact-box .eyebrow::after{
  content:""; width:34px; height:1px; background:linear-gradient(90deg,var(--gold),transparent);
}
.contact-cta{ justify-content:center; }
.contact-list{ width:100%; max-width:420px; margin-inline:auto; }
.contact-item:hover{ border-color:rgba(201,163,92,.45); background:rgba(201,163,92,.06); }
.contact-box::before{
  content:""; position:absolute; inset-block-start:-40%; inset-inline-start:-10%;
  width:60%; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle, rgba(201,163,92,.16), transparent 62%);
}
.contact-box h2{
  font-family:"DM Serif Display",serif; font-size:clamp(28px,4.2vw,46px); line-height:1.15; margin:14px 0 16px;
}
.contact-cta{ margin-top:30px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
.contact-list{ display:grid; gap:14px; position:relative; }
.contact-item{
  display:flex; gap:14px; align-items:center; padding:16px 18px; text-align:right;
  border:1px solid var(--line); border-radius:14px; background:rgba(12,10,8,.5);
}
.contact-item svg{ width:19px; height:19px; color:var(--gold); flex:none; }
.contact-item b{ display:block; font-size:11px; letter-spacing:.2em; color:var(--muted-2); font-weight:400; }
.contact-item span{ font-size:15px; }

/* ---------- السعر ---------- */
.price{
  display:inline-flex; align-items:baseline; gap:10px;
  margin-top:22px; padding:13px 26px; border-radius:999px;
  border:1px solid rgba(201,163,92,.45);
  background:linear-gradient(135deg, rgba(201,163,92,.18), rgba(201,163,92,.04) 70%);
  box-shadow:0 16px 40px -24px rgba(201,163,92,.85);
  position:relative; overflow:hidden;
}
.price::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 35%, rgba(255,255,255,.18) 50%, transparent 65%);
  transform:translateX(-120%);
  animation:priceShine 5.5s ease-in-out infinite;
}
@keyframes priceShine{ 0%,72%{ transform:translateX(-120%); } 100%{ transform:translateX(120%); } }
.price b{
  font-family:"DM Serif Display",serif; font-weight:400;
  font-size:clamp(34px,3.8vw,46px); line-height:1; letter-spacing:.01em;
  filter:drop-shadow(0 0 22px rgba(201,163,92,.35));
  background:linear-gradient(180deg,#fffaf0 8%, var(--gold-2) 52%, #a37c37 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.price .riyal{
  font-family:"Noto Naskh Arabic","Amiri",serif; font-weight:500;
  font-size:clamp(26px,3vw,36px); line-height:1; color:var(--gold-2);
  text-shadow:0 0 18px rgba(201,163,92,.35);
}

/* ---------- الأنيميشن الافتتاحي ---------- */
.intro{
  position:fixed; inset:0; z-index:200; background:#0a0907;
  display:grid; place-items:center; overflow:hidden;
}
.intro.done{ animation:introOut .85s var(--ease) forwards; }
@keyframes introOut{ to{ opacity:0; visibility:hidden; } }
.intro-inner{ display:flex; flex-direction:column; align-items:center; }
.intro-letters{
  display:flex; gap:clamp(2px,.7vw,12px);
  direction:ltr;
  font-family:"DM Serif Display",serif; font-size:clamp(38px,8.5vw,104px);
  color:var(--gold-2); line-height:1;
  animation:lettersExit .75s 1.95s var(--ease) forwards;
}
.intro-letters span{
  display:inline-block; opacity:0;
  animation:letterDrop 1s var(--ease) var(--d,0s) forwards;
}
@keyframes letterDrop{
  0%{ opacity:0; transform:translateY(-130%) rotate(-7deg); filter:blur(16px); }
  55%{ opacity:1; filter:blur(0); }
  100%{ opacity:1; transform:translateY(0) rotate(0); filter:blur(0); }
}
@keyframes lettersExit{
  to{ opacity:0; transform:translateY(-46px) scale(.94); filter:blur(10px); }
}
.intro-rule{
  display:block; height:1px; width:0; margin:22px 0 16px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:ruleGrow 1.7s .3s var(--ease) forwards;
}
@keyframes ruleGrow{ to{ width:min(520px,70vw); } }
.intro-sub{
  font-family:"Amiri",serif; font-size:clamp(16px,2.4vw,24px); color:var(--muted);
  opacity:0; animation:fadeIn .9s 1.1s var(--ease) forwards;
}
@keyframes fadeIn{ to{ opacity:1; } }

/* ---------- شريط الشراء الثابت (جوال) ---------- */
.buybar{
  position:fixed; inset-inline:0; inset-block-end:0; z-index:60;
  display:none; gap:14px; align-items:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(13,11,9,.93); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  transform:translateY(140%); transition:transform .45s var(--ease);
}
.buybar.show{ transform:none; }
.buybar .btn{ flex:1; }
.buybar .arabic-label{ white-space:nowrap; }

/* ---------- الفوتر ---------- */
.foot{
  position:relative; z-index:2; border-top:1px solid var(--line);
  padding:34px 0; margin-top:20px;
}
.foot-in{ display:flex; flex-wrap:wrap; gap:18px; justify-content:space-between; align-items:center; }
.foot-in p{ font-size:13px; color:var(--muted-2); }
.foot-in .fb{ font-family:"Outfit",sans-serif; letter-spacing:.3em; font-size:13px; color:var(--cream); }

/* ---------- ظهور تدريجي ---------- */
.reveal{ opacity:0; transform:translateY(26px); transition:opacity .9s var(--ease), transform .9s var(--ease); }
.reveal.in{ opacity:1; transform:none; }
.reveal.d1{ transition-delay:.08s } .reveal.d2{ transition-delay:.16s }
.reveal.d3{ transition-delay:.24s } .reveal.d4{ transition-delay:.32s }

/* ---------- استجابة ---------- */
@media (max-width:980px){
  .hero-grid{ grid-template-columns:1fr; }
  .stage{ aspect-ratio:16/11; }
  .contact-box{ grid-template-columns:1fr; }
}
@media (max-width:760px){
  .nav-links{ display:none; }
  .nav-cta{ display:none; }
  .nav-in{ height:66px; }
  .buybar{ display:flex; }
  body{ padding-bottom:78px; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
  .reveal{ opacity:1; transform:none; }
}
</style>
</head>

<body>
<div class="grain" aria-hidden="true"></div>

  <div class="intro-inner">
    <div class="intro-letters">
      <span style="--d:.34s">T</span><span style="--d:.43s">H</span><span style="--d:.52s">A</span><span style="--d:.61s">M</span><span style="--d:.70s">N</span><span style="--d:.79s">E</span><span style="--d:.88s">E</span><span style="--d:.97s">L</span>
    </div>

</div>

<!-- ======================= التنقل ======================= -->
<header class="nav">
  <div class="wrap nav-in">

<main id="top">

  <!-- ======================= الواجهة ======================= -->
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <h1 class="reveal d1">THAMNEEL</h1>
        <p class="arabic-name reveal d1">ثامنيل</p>

        <div class="price reveal d2">
          <b>10</b><span class="riyal">﷼</span>
        </div>

        <div class="hero-actions reveal d3">
          <a class="btn btn-primary" data-buy href="#contact">
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            شراء ثامنيل
          </a>
        </div>

      </div>

      <div class="stage reveal d3" aria-label="معاينة من منصة ثامنيل">
        <div class="stage-caption"><span>THAMNEEL</span></div>
        <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2a231b"/><stop offset=".55" stop-color="#15120e"/><stop offset="1" stop-color="#0a0907"/>
            </linearGradient>
            <radialGradient id="g2" cx=".72" cy=".28" r=".7">
              <stop offset="0" stop-color="#c9a35c" stop-opacity=".38"/><stop offset="1" stop-color="#c9a35c" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#000" stop-opacity=".72"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
            </linearGradient>
            <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
          </defs>
          <rect width="400" height="500" fill="url(#g1)"/>

  <a class="btn btn-primary" data-buy href="#contact">شراء ثامنيل</a>
</div>

<script>
const SITE = {
  buyUrl: "https://www.instagram.com/sa7lab_777?exln=Z3UwNmF4M2dwMDV3",
};

document.querySelectorAll("[data-buy]").forEach(function (el) {
  el.setAttribute("href", SITE.buyUrl);
  el.setAttribute("target", SITE.buyUrl === "#" ? "_self" : "_blank");
  el.setAttribute("rel", "noopener");
});

document.getElementById("year").textContent = new Date().getFullYear();

function startReveal() {
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  document.querySelectorAll(".reveal").forEach(function (el) { io.observe(el); });
}

(function () {
  const intro = document.getElementById("intro");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let started = false;

  function begin() {
    if (started) return;
    started = true;
    startReveal();
  }

  if (!intro || reduce) {
    if (intro) intro.remove();
    begin();
    return;
  }

  setTimeout(function () { intro.classList.add("done"); }, 2750);

  intro.addEventListener("animationend", function (e) {
    if (e.animationName === "introOut") { intro.remove(); begin(); }
  });

  setTimeout(function () {
    const el = document.getElementById("intro");
    if (el) el.remove();
    begin();
  }, 4200);
})();

const hero = document.querySelector(".hero");
if (hero && window.matchMedia("(pointer:fine)").matches) {
  hero.addEventListener("pointermove", function (e) {
    const r = hero.getBoundingClientRect();
    hero.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%");
    hero.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
  });
}

const bar = document.getElementById("buybar");
if (bar) {
  const onScroll = function () {
    bar.classList.toggle("show", window.scrollY > 520);
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
}
</script>
